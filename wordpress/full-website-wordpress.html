<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GatePass &amp; Loading Slip Manager</title>
  <meta name="description" content="Full Website Portal — Material Loading Ticket Generator, Gate Queue Tracker, Security Guard Monitor &amp; A4 Loading Slip." />
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef3f8;
    }

    #gp-full-website {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 99990;
      background: #eef3f8;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Keep WordPress Admin Bar accessible when WP Admin is logged in */
    body.admin-bar #gp-full-website {
      top: 32px;
      height: calc(100vh - 32px);
      height: calc(100dvh - 32px);
    }
    @media screen and (max-width: 782px) {
      body.admin-bar #gp-full-website {
        top: 46px;
        height: calc(100vh - 46px);
        height: calc(100dvh - 46px);
      }
    }

    #gp-full-website iframe.gp-full-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #eef3f8;
    }

    #gp-full-website .gp-full-splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #1e2e3e 0%, #263748 55%, #1a4369 100%);
      color: #ffffff;
      text-align: center;
      padding: 24px;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }
    #gp-full-website .gp-full-splash.is-ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #gp-full-website .gp-spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.22);
      border-top-color: #f0ab00;
      animation: gpSpin 0.8s linear infinite;
    }
    @keyframes gpSpin {
      to { transform: rotate(360deg); }
    }
    #gp-full-website .gp-splash-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    #gp-full-website .gp-splash-sub {
      margin: 0;
      font-size: 13px;
      color: #cbd5e1;
    }
    #gp-full-website .gp-fallback-btn {
      display: none;
      margin-top: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      background: #0a6ed1;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid #68aeff;
    }
    #gp-full-website .gp-fallback-btn.is-visible {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="gp-full-website">
    <div id="gp-full-splash" class="gp-full-splash">
      <div class="gp-spinner" aria-hidden="true"></div>
      <h1 class="gp-splash-title">GatePass &amp; Loading Slip Manager</h1>
      <p class="gp-splash-sub">Loading live workspace...</p>
      <a
        id="gp-fallback-link"
        class="gp-fallback-btn"
        href="https://loadingmanager.store/"
        rel="noopener noreferrer"
      >
        Open GatePass App Directly
      </a>
    </div>

    <iframe
      id="gp-full-frame"
      class="gp-full-frame"
      title="GatePass &amp; Loading Slip Manager — Full Website"
      src="https://loadingmanager.store/"
      loading="eager"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>

  <script>
    (function () {
      // Live App URL (sirf feature update deploy hone par yahi live version load hoga — zero data loss)
      var APP_URL = "https://loadingmanager.store/";

      var frame = document.getElementById("gp-full-frame");
      var splash = document.getElementById("gp-full-splash");
      var fallbackLink = document.getElementById("gp-fallback-link");

      if (!frame) return;

      // URL query parameters forward karein (jaise ?driverStatus=TOKEN)
      try {
        var currentParams = new URLSearchParams(window.location.search);
        var target = new URL(APP_URL);
        var driverToken = currentParams.get("driverStatus");
        if (driverToken) {
          target.searchParams.set("driverStatus", driverToken);
        }
        frame.src = target.toString();
        if (fallbackLink) fallbackLink.href = target.toString();
      } catch (e) {
        frame.src = APP_URL;
      }

      var loaded = false;
      frame.addEventListener("load", function () {
        loaded = true;
        if (splash) splash.classList.add("is-ready");
      });

      // Agar slow network ya browser restriction ho to 6 sec baad direct open button dikhayein
      setTimeout(function () {
        if (!loaded && fallbackLink) {
          fallbackLink.classList.add("is-visible");
        }
      }, 6000);
    })();
  </script>
</body>
</html>
