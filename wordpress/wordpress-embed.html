<!--
  GatePass & Loading Slip Manager — Safe WordPress Embed HTML
  ==========================================================
  HOW TO USE IN WORDPRESS:
  1. Edit any WordPress Page -> Add Block -> "Custom HTML" (or Elementor "HTML" widget).
  2. Paste this entire code and Update/Publish the page.
  3. Change `APP_URL` below ONLY if your live app runs on a different domain/subdomain.

  WHY DATA IS 100% SAFE ON FUTURE UPDATES:
  - This snippet is completely isolated inside `#gp-wp-embed-root`. It never touches
    WordPress database tables, theme files, posts, users, or cookies.
  - All future feature updates deployed to your GatePass app URL automatically load
    inside WordPress without overwriting WordPress data or GatePass SQLite records
    (stored separately via DB_DIR).
-->
<div id="gp-wp-embed-root" class="gp-wp-shell">
  <style>
    /* Strictly scoped styles — zero impact on main WordPress theme */
    #gp-wp-embed-root.gp-wp-shell {
      all: initial;
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 12px auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
      background: #f8fafc;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
    }
    #gp-wp-embed-root * {
      box-sizing: border-box;
    }
    #gp-wp-embed-root .gp-wp-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(90deg, #1e2e3e 0%, #263748 60%, #1a4369 100%);
      color: #ffffff;
      border-bottom: 1px solid #334155;
    }
    #gp-wp-embed-root .gp-wp-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    #gp-wp-embed-root .gp-wp-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
      flex-shrink: 0;
    }
    #gp-wp-embed-root .gp-wp-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #gp-wp-embed-root .gp-wp-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    #gp-wp-embed-root .gp-wp-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      text-decoration: none;
      line-height: 1.2;
      transition: background 0.15s ease;
    }
    #gp-wp-embed-root .gp-wp-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    #gp-wp-embed-root .gp-wp-btn-primary {
      background: #0a6ed1;
      border-color: #3b93ee;
    }
    #gp-wp-embed-root .gp-wp-btn-primary:hover {
      background: #085caf;
    }
    #gp-wp-embed-root .gp-wp-frame-wrap {
      position: relative;
      width: 100%;
      height: clamp(720px, 84vh, 1080px);
      background: #eef3f8;
    }
    #gp-wp-embed-root.gp-wp-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      margin: 0;
      border-radius: 0;
      border: 0;
      width: 100vw;
      height: 100vh;
    }
    #gp-wp-embed-root.gp-wp-fullscreen .gp-wp-frame-wrap {
      height: calc(100vh - 46px);
    }
    #gp-wp-embed-root iframe.gp-wp-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #eef3f8;
    }
    #gp-wp-embed-root .gp-wp-loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      background: #eef3f8;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #gp-wp-embed-root .gp-wp-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>

  <div class="gp-wp-bar">
    <div class="gp-wp-title-wrap">
      <span class="gp-wp-dot" aria-hidden="true"></span>
      <p class="gp-wp-title">GatePass &amp; Loading Slip Manager</p>
    </div>
    <div class="gp-wp-actions">
      <button type="button" class="gp-wp-btn" id="gp-wp-reload-btn">Refresh</button>
      <button type="button" class="gp-wp-btn gp-wp-btn-primary" id="gp-wp-fs-btn">Fullscreen</button>
      <a
        id="gp-wp-ext-link"
        class="gp-wp-btn"
        href="https://loadingmanager.store/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Full Tab
      </a>
    </div>
  </div>

  <div class="gp-wp-frame-wrap">
    <div class="gp-wp-loader" id="gp-wp-loader">Loading GatePass Manager...</div>
    <iframe
      id="gp-wp-iframe"
      class="gp-wp-iframe"
      title="GatePass and Loading Slip Manager"
      src="https://loadingmanager.store/"
      loading="eager"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>
</div>

<script>
  (function () {
    // Update this URL only if you host the GatePass Node.js app on another domain/subdomain
    var APP_URL = "https://loadingmanager.store/";

    var root = document.getElementById("gp-wp-embed-root");
    var iframe = document.getElementById("gp-wp-iframe");
    var loader = document.getElementById("gp-wp-loader");
    var reloadBtn = document.getElementById("gp-wp-reload-btn");
    var fsBtn = document.getElementById("gp-wp-fs-btn");
    var extLink = document.getElementById("gp-wp-ext-link");

    if (!root || !iframe) return;

    // Pass through driver status token query (?driverStatus=...) if opened on WordPress page
    try {
      var pageParams = new URLSearchParams(window.location.search);
      var targetUrl = new URL(APP_URL);
      var driverToken = pageParams.get("driverStatus");
      if (driverToken) {
        targetUrl.searchParams.set("driverStatus", driverToken);
      }
      iframe.src = targetUrl.toString();
      if (extLink) extLink.href = targetUrl.toString();
    } catch (e) {
      iframe.src = APP_URL;
    }

    iframe.addEventListener("load", function () {
      if (loader) loader.classList.add("is-hidden");
    });

    if (reloadBtn) {
      reloadBtn.addEventListener("click", function () {
        if (loader) loader.classList.remove("is-hidden");
        try {
          var reloadUrl = new URL(iframe.src);
          reloadUrl.searchParams.set("_wpRefresh", String(Date.now()));
          iframe.src = reloadUrl.toString();
        } catch (e) {
          iframe.src = APP_URL;
        }
      });
    }

    if (fsBtn) {
      fsBtn.addEventListener("click", function () {
        var active = root.classList.toggle("gp-wp-fullscreen");
        fsBtn.textContent = active ? "Exit Fullscreen" : "Fullscreen";
      });
    }
  })();
</script>
